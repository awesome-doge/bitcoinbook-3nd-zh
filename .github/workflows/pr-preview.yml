name: PR Preview Build

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'zh-tw/**'
      - 'images/**'
      - 'web/**'
      - 'scripts/build-site.rb'
      - 'scripts/check-site.rb'

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install build tools
        run: |
          gem install asciidoctor rouge nokogiri --no-document
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp

      - name: Build site preview
        run: ruby scripts/build-site.rb preview
        env:
          STRICT_LINKS: '1'

      - name: Check links, anchors and SEO metadata
        run: ruby scripts/check-site.rb preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-html-pr-${{ github.event.pull_request.number }}
          path: preview/
          retention-days: 7

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const runId = context.runId;
            const repo = context.repo;

            const comment = `## 📚 預覽建置完成

            您的翻譯預覽已經建置完成！

            ### 📥 下載預覽

            [點此下載 HTML 預覽檔案](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})

            請在 Artifacts 區塊下載 \`preview-html-pr-${prNumber}\` 檔案，解壓縮後在該資料夾執行 \`python3 -m http.server\`，再用瀏覽器開啟 http://localhost:8000/ 。

            ### ✅ 建置資訊

            - **PR 編號**: #${prNumber}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **建置時間**: ${new Date().toISOString()}

            ---

            🤖 此留言由 GitHub Actions 自動產生`;

            github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
              body: comment
            });
