name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'zh-tw/**'
      - 'images/**'
      - 'web/**'
      - 'scripts/build-site.rb'
      - 'scripts/check-site.rb'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # sitemap 的 lastmod 取自各章原始檔的最後修改時間

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install build tools
        run: |
          gem install asciidoctor rouge nokogiri --no-document
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp

      - name: Build site
        run: ruby scripts/build-site.rb public
        env:
          STRICT_LINKS: '1'
          WRITE_CNAME: '1'

      - name: Check links, anchors and SEO metadata
        run: ruby scripts/check-site.rb public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping search engines
        if: success()
        run: |
          # IndexNow（Bing、Yandex、Naver、Seznam 等）：通知所有頁面已更新
          urls=$(curl -s https://bitcoinbook-3nd-zh.doge.tg/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"bitcoinbook-3nd-zh.doge.tg\",\"key\":\"6aa3100e6866ac02756a2f5225285d51\",\"keyLocation\":\"https://bitcoinbook-3nd-zh.doge.tg/6aa3100e6866ac02756a2f5225285d51.txt\",\"urlList\":${urls}}" > /dev/null || true
