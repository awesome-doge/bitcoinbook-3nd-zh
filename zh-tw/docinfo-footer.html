<!-- 全面閱讀體驗優化 -->
<style>
/* ===== CSS 自訂屬性（亮色/暗色模式） ===== */
:root {
  /* 色彩系統 */
  --color-bg: #fff;
  --color-bg-secondary: #f8f8f7;
  --color-bg-code: #f5f6f8;
  --color-bg-sidebar: #f3f3f2;
  --color-bg-admonition: #fafafa;
  --color-bg-quote: #fffaf5;
  --color-text: #2c3e50;
  --color-text-secondary: rgba(0,0,0,.6);
  --color-text-muted: #6c757d;
  --color-heading: #1a1a2e;
  --color-link: #2156a5;
  --color-link-hover: #1d4b8f;
  --color-border: #e0e0e0;
  --color-border-light: #e7e7e9;
  --color-accent: #f7931a;
  --color-accent-dark: #e07c00;
  --color-code-text: #1a1a2e;
  --color-toc-bg: #f8f8f7;
  --color-toc-active: #fff7ed;
  --color-shadow: rgba(0,0,0,0.08);
  --color-overlay: rgba(0,0,0,0.7);

  /* 排版系統 */
  --font-body: "Noto Serif CJK TC", "Source Han Serif TC", "Noto Serif TC", "PingFang TC", "Apple LiGothic", "Microsoft JhengHei", "Noto Serif", Georgia, serif;
  --font-heading: "Noto Sans CJK TC", "Source Han Sans TC", "PingFang TC", "Microsoft JhengHei", "Noto Sans", "Open Sans", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Droid Sans Mono", "Noto Sans Mono CJK TC", monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;

  /* 間距系統 */
  --content-max-width: 44em;
  --line-height-body: 1.9;
  --line-height-heading: 1.35;
  --line-height-code: 1.55;
  --paragraph-spacing: 1.5em;
  --section-spacing: 2.5em;
  --letter-spacing-body: 0.02em;
}

/* ===== 暗色模式 ===== */
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1a1b26;
    --color-bg-secondary: #1f2133;
    --color-bg-code: #24253a;
    --color-bg-sidebar: #1f2133;
    --color-bg-admonition: #1f2133;
    --color-bg-quote: #22233a;
    --color-text: #c9d1d9;
    --color-text-secondary: #9ca3af;
    --color-text-muted: #6b7280;
    --color-heading: #e6e8f0;
    --color-link: #6ea8fe;
    --color-link-hover: #93c5fd;
    --color-border: #30363d;
    --color-border-light: #2a2d3a;
    --color-accent: #f7931a;
    --color-accent-dark: #ff9f33;
    --color-code-text: #c9d1d9;
    --color-toc-bg: #1f2133;
    --color-toc-active: #2a2d3a;
    --color-shadow: rgba(0,0,0,0.3);
    --color-overlay: rgba(0,0,0,0.85);
  }
}

/* ===== 全域基礎樣式 ===== */
html {
  overflow-x: hidden;
  scroll-behavior: smooth;
}

body, body.book, body.book.toc2 {
  overflow-x: hidden;
  width: 100%;
  background: var(--color-bg) !important;
  color: var(--color-text) !important;
  font-family: var(--font-body) !important;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: var(--line-height-body) !important;
  letter-spacing: var(--letter-spacing-body);
}

/* 防溢出 */
#header, #content, #footnotes, #footer,
.sect1, .sect2, .sect3, .sect4,
.paragraph, .listingblock, .literalblock,
.imageblock, .tableblock, .admonitionblock,
.sidebarblock, .exampleblock, .quoteblock,
.ulist, .olist, .dlist, .hdlist, .colist {
  max-width: 100%;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

img, svg, video, canvas, iframe, embed, object {
  max-width: 100%;
  height: auto;
}

pre {
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tableblock, table {
  max-width: 100%;
  overflow-x: auto;
}

a, span {
  overflow-wrap: break-word;
}

/* 中文標點與斷行優化 */
:lang(zh-TW), :lang(zh) {
  line-break: strict;
  word-break: normal;
  overflow-wrap: break-word;
}

@supports (hanging-punctuation: first allow-end last) {
  :lang(zh-TW), :lang(zh) {
    hanging-punctuation: first allow-end last;
  }
}

/* ===== 桌面版全域排版優化 ===== */

/* 內容區域 — toc2 模式下居中 */
#header, #content, #footnotes {
  max-width: var(--content-max-width) !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

/* 頁尾不限寬 */
#footer {
  max-width: none !important;
}

/* 段落 */
p, .paragraph p, .sectionbody p {
  line-height: var(--line-height-body) !important;
  margin-bottom: var(--paragraph-spacing);
  color: var(--color-text);
}

/* 覆寫 preamble/lead 段落的大字體 */
.paragraph.lead > p,
#preamble > .sectionbody > [class=paragraph]:first-of-type p {
  font-size: 1.1rem !important;
  line-height: var(--line-height-body) !important;
  color: var(--color-text) !important;
}

/* 覆寫 quoteblock 的 text-align:justify */
.quoteblock blockquote, .quoteblock p {
  text-align: left !important;
  word-spacing: normal !important;
}

/* 標題 */
h1, h2, h3, #toctitle, .sidebarblock>.content>.title, h4, h5, h6 {
  font-family: var(--font-heading) !important;
  color: var(--color-heading) !important;
  line-height: var(--line-height-heading) !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em;
  word-spacing: normal !important;
}

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  color: var(--color-heading) !important;
  font-family: var(--font-heading) !important;
}

h1 { font-size: 2.2em !important; margin-top: 1.5em; margin-bottom: 0.6em; }
h2 { font-size: 1.75em !important; margin-top: var(--section-spacing); margin-bottom: 0.6em; padding-bottom: 0.3em; border-bottom: 2px solid var(--color-border-light); }
h3, .sidebarblock>.content>.title { font-size: 1.4em !important; margin-top: 2em; }
h4 { font-size: 1.2em !important; margin-top: 1.5em; }
h5, h6 { font-size: 1.05em !important; margin-top: 1.25em; }

/* 連結 — 正文中連結不加底線，hover 才加 */
a {
  color: var(--color-link) !important;
  text-decoration: none !important;
  transition: color 0.15s;
  border-bottom: 1px solid transparent;
}

a:hover, a:focus {
  color: var(--color-link-hover) !important;
  border-bottom-color: var(--color-link-hover);
}

/* TOC 連結不需要 hover 底線 */
#toc a, #floating-toc-content a {
  border-bottom: none !important;
}

/* 章節分隔 — 漸層分隔線 + 充足間距 */
.sect1 { padding-bottom: var(--section-spacing); }
.sect1 + .sect1 {
  padding-top: var(--section-spacing);
  border-top: none;
  position: relative;
}
.sect1 + .sect1::before {
  content: '';
  display: block;
  width: 60%;
  max-width: 300px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--color-border), var(--color-accent), var(--color-border), transparent);
  margin: 0 auto 2em;
  border-radius: 1px;
}

/* 程式碼 — 行內 */
:not(pre):not([class^=L]) > code {
  font-family: var(--font-mono);
  font-size: 0.875em;
  background: var(--color-bg-code);
  color: var(--color-code-text);
  padding: 0.15em 0.4em;
  border-radius: 4px;
  word-break: break-word;
  overflow-wrap: break-word;
}

/* 程式碼區塊 */
.listingblock {
  position: relative;
  margin: 1.5em 0;
}

.literalblock pre, .listingblock > .content > pre {
  font-family: var(--font-mono);
  background: var(--color-bg-code) !important;
  color: var(--color-code-text);
  border: 1px solid var(--color-border-light);
  border-radius: 8px;
  line-height: var(--line-height-code);
  padding: 1.25em;
}

pre code {
  font-family: var(--font-mono);
  color: var(--color-code-text);
}

/* 語言標籤 — 常駐顯示 */
.listingblock code[data-lang]::before {
  display: block !important;
  content: attr(data-lang);
  position: absolute;
  top: 0;
  right: 0;
  font-size: 0.7em;
  font-family: var(--font-ui);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
  background: var(--color-bg-secondary);
  padding: 0.25em 0.6em;
  border-radius: 0 8px 0 6px;
  border-bottom: 1px solid var(--color-border-light);
  border-left: 1px solid var(--color-border-light);
  opacity: 0.8;
}

/* 程式碼區塊標題 */
.listingblock > .title, .literalblock > .title {
  color: var(--color-text-secondary) !important;
  font-family: var(--font-ui);
  font-size: 0.85rem;
  margin-bottom: 0.4em;
}

/* 程式碼行號（CSS counter） */
.listingblock pre.highlight code,
.listingblock > .content > pre > code {
  counter-reset: line-number;
}

.listingblock pre.highlight code > span,
.listingblock > .content > pre > code > span {
  counter-increment: line-number;
}

/* JS 行號注入的樣式 */
.code-line-numbers {
  position: absolute;
  left: 0;
  top: 0;
  padding: 1.25em 0;
  width: 3em;
  text-align: right;
  font-family: var(--font-mono);
  font-size: inherit;
  line-height: inherit;
  color: var(--color-text-muted);
  opacity: 0.4;
  user-select: none;
  pointer-events: none;
  border-right: 1px solid var(--color-border-light);
  padding-right: 0.5em;
}

.listingblock.has-line-numbers > .content > pre {
  padding-left: 4em !important;
}

/* 表格美化 */
table.tableblock, table.tableblock.frame-all {
  background: var(--color-bg) !important;
  border: 1px solid var(--color-border) !important;
  border-radius: 8px !important;
  overflow: hidden;
  border-collapse: separate !important;
  border-spacing: 0 !important;
}

table thead, table tfoot {
  background: var(--color-bg-secondary) !important;
}

table thead tr th {
  color: var(--color-heading) !important;
  font-family: var(--font-heading);
  font-weight: 600 !important;
  font-size: 0.9em;
  letter-spacing: 0.02em;
  border-color: var(--color-border) !important;
}

table thead tr td,
table tfoot tr th, table tfoot tr td,
table tr td {
  color: var(--color-text) !important;
  border-color: var(--color-border-light) !important;
  line-height: 1.7;
}

table tr.even, table tr.alt {
  background: var(--color-bg-secondary) !important;
}

/* 表格標題 */
table.tableblock > caption.title, .tableblock > .title {
  color: var(--color-text-muted) !important;
  font-family: var(--font-ui);
  font-size: 0.88rem;
  text-align: center;
  font-style: italic;
  margin-bottom: 0.5em;
}

/* 警告框 — 彩色左邊框 + 圖示背景 */
.admonitionblock > table {
  background: var(--color-bg-admonition) !important;
  border-radius: 8px;
  border: none !important;
  border-left: 4px solid var(--color-border) !important;
  box-shadow: 0 1px 3px var(--color-shadow);
}

.admonitionblock.tip > table { border-left-color: #10b981 !important; }
.admonitionblock.note > table { border-left-color: #3b82f6 !important; }
.admonitionblock.warning > table { border-left-color: #f59e0b !important; }
.admonitionblock.caution > table { border-left-color: #ef4444 !important; }
.admonitionblock.important > table { border-left-color: #8b5cf6 !important; }

.admonitionblock > table td.icon {
  background: none !important;
  vertical-align: top;
  padding: 1em 0.75em !important;
}

.admonitionblock > table td.icon .title {
  color: var(--color-text-secondary) !important;
  font-size: 0.75em;
  letter-spacing: 0.05em;
}

.admonitionblock.tip > table td.icon i { color: #10b981 !important; }
.admonitionblock.note > table td.icon i { color: #3b82f6 !important; }
.admonitionblock.warning > table td.icon i { color: #f59e0b !important; }
.admonitionblock.caution > table td.icon i { color: #ef4444 !important; }
.admonitionblock.important > table td.icon i { color: #8b5cf6 !important; }

.admonitionblock > table td.content {
  color: var(--color-text) !important;
  border-left: none !important;
  line-height: var(--line-height-body);
  padding: 1em 1.25em;
}

/* 側邊欄 */
.sidebarblock {
  background: var(--color-bg-sidebar) !important;
  border: 1px solid var(--color-border-light) !important;
  border-radius: 8px;
  padding: 1.5em;
}

.sidebarblock > .content > .title {
  color: var(--color-heading) !important;
}

.sidebarblock p, .sidebarblock li {
  color: var(--color-text);
}

/* 引用區塊 */
.quoteblock {
  border-left: 4px solid var(--color-accent) !important;
  background: var(--color-bg-quote);
  padding: 1em 1.25em;
  border-radius: 0 8px 8px 0;
  margin: 1.5em 0;
}

.quoteblock blockquote, .quoteblock p {
  color: var(--color-text) !important;
  font-size: 1.05rem;
  line-height: 1.8;
}

.quoteblock blockquote::before {
  color: var(--color-accent) !important;
}

.quoteblock .attribution {
  color: var(--color-text-muted);
}

/* 範例區塊 */
.exampleblock {
  margin: 1.5em 0;
}

.exampleblock > .content {
  background: var(--color-bg) !important;
  border: 1px solid var(--color-border-light) !important;
  border-radius: 8px;
  padding: 1.25em !important;
}

.exampleblock > .title {
  color: var(--color-text-secondary) !important;
  font-family: var(--font-ui);
  font-weight: 600;
  font-style: normal !important;
  font-size: 0.9rem;
  margin-bottom: 0.5em;
}

/* 列表 */
ul, ol {
  line-height: var(--line-height-body);
}

li {
  margin-bottom: 0.4em;
}

li p {
  margin-bottom: 0.5em;
}

/* 定義列表 */
dl dt {
  color: var(--color-heading);
  font-weight: 600;
}

dl dd {
  line-height: var(--line-height-body);
}

/* 頁首 */
#header > h1:first-child {
  color: var(--color-heading) !important;
}

#header .details {
  color: var(--color-text-secondary) !important;
  border-color: var(--color-border-light) !important;
}

/* 頁尾 */
#footer {
  background: var(--color-bg-secondary) !important;
  border-top: 1px solid var(--color-border-light);
}

#footer-text {
  color: var(--color-text-secondary) !important;
}

/* 標題底線 */
.subheader, .admonitionblock td.content>.title, .audioblock>.title,
.exampleblock>.title, .imageblock>.title, .listingblock>.title,
.literalblock>.title, .stemblock>.title, .openblock>.title,
.paragraph>.title, .quoteblock>.title, table.tableblock>.title,
.verseblock>.title, .videoblock>.title, .dlist>.title, .olist>.title,
.ulist>.title, .qlist>.title, .hdlist>.title {
  color: var(--color-text-secondary) !important;
}

/* 圖片美化 */
.imageblock {
  margin: 2em 0;
}

.imageblock img {
  border-radius: 6px;
  box-shadow: 0 2px 8px var(--color-shadow);
  transition: box-shadow 0.2s;
}

.imageblock img:hover {
  box-shadow: 0 4px 16px var(--color-shadow);
}

.imageblock > .title {
  color: var(--color-text-muted);
  font-size: 0.88rem;
  margin-top: 0.75em;
  text-align: center;
  font-style: italic;
  font-family: var(--font-ui);
}

/* 註腳 */
#footnotes {
  border-top: 1px solid var(--color-border-light);
  color: var(--color-text-secondary);
}

/* ===== 桌面版 TOC 優化 ===== */
@media screen and (min-width: 768px) {
  body.toc2 {
    padding-left: 18em !important;
    padding-right: 1.5em !important;
  }

  /* 內容居中在 TOC 右側可用空間 */
  body.toc2 #header,
  body.toc2 #content,
  body.toc2 #footnotes {
    padding-left: 2em !important;
    padding-right: 2em !important;
  }

  #toc.toc2 {
    width: 18em !important;
    background: var(--color-toc-bg) !important;
    border-right: 1px solid var(--color-border-light) !important;
    padding: 1.25em 0.75em !important;
  }

  #toc.toc2 #toctitle {
    color: var(--color-heading);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 1.1em;
    padding: 0 0.5em 0.75em;
    margin-bottom: 0.75em;
    border-bottom: 2px solid var(--color-accent);
  }

  #toc.toc2 ul {
    font-family: var(--font-ui);
  }

  #toc.toc2 > ul {
    margin-bottom: 0 !important;
    margin-left: 0 !important;
  }

  #toc.toc2 ul {
    margin-bottom: 0 !important;
    line-height: 1.3 !important;
  }

  #toc.toc2 a {
    color: var(--color-text-secondary);
    display: block;
    padding: 0.15em 0.5em;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    font-size: 0.8em;
    line-height: 1.3;
  }

  #toc.toc2 a:hover {
    background: var(--color-toc-active);
    color: var(--color-accent);
  }

  #toc.toc2 li {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    line-height: 1.3 !important;
  }

  /* 桌面版 TOC 當前章節高亮 */
  #toc.toc2 a.toc-active {
    background: var(--color-toc-active);
    color: var(--color-accent) !important;
    border-left: 3px solid var(--color-accent);
    margin-left: -3px;
    font-weight: 500;
  }

  /* 桌面版 TOC 可收合 */
  #toc.toc2 .toc-toggle {
    display: inline-block;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    font-size: 10px;
    color: var(--color-text-muted);
    cursor: pointer;
    border-radius: 3px;
    margin-right: 2px;
    transition: transform 0.15s, background 0.15s;
    flex-shrink: 0;
    user-select: none;
  }

  #toc.toc2 .toc-toggle:hover {
    background: var(--color-toc-active);
    color: var(--color-accent);
  }

  #toc.toc2 .toc-toggle.collapsed {
    transform: rotate(-90deg);
  }

  #toc.toc2 li.toc-collapsed > ul {
    display: none;
  }

  #toc.toc2 li > a {
    display: inline;
  }

  #toc.toc2 .sectlevel0 > li,
  #toc.toc2 .sectlevel1 > li {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
  }

  #toc.toc2 .sectlevel0 > li > ul,
  #toc.toc2 .sectlevel1 > li > ul {
    width: 100%;
  }

  /* 桌面版 TOC 底部閱讀統計 */
  #toc-stats {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 12px;
    background: var(--color-bg-secondary);
    border-top: 1px solid var(--color-border-light);
    font-family: var(--font-ui);
    font-size: 0.75em;
    color: var(--color-text-muted);
  }

  #toc-stats .stats-progress {
    height: 3px;
    background: var(--color-border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  #toc-stats .stats-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--color-accent), #ff6b00);
    border-radius: 2px;
    transition: width 0.5s;
  }

  /* 嵌入式 TOC */
  #content #toc {
    background: var(--color-bg-secondary) !important;
    border-color: var(--color-border-light) !important;
    border-radius: 8px;
  }
}

@media screen and (min-width: 1280px) {
  body.toc2 {
    padding-left: 22em !important;
    padding-right: 2em !important;
  }

  body.toc2 #header,
  body.toc2 #content,
  body.toc2 #footnotes {
    padding-left: 3em !important;
    padding-right: 3em !important;
  }

  #toc.toc2 {
    width: 22em !important;
  }

  #toc.toc2 a {
    font-size: 0.9em;
    padding: 0.4em 0.6em;
  }
}

/* ===== 手機版優化 (小於 768px) ===== */
@media screen and (max-width: 767px) {
  html {
    font-size: 100%;
    -webkit-text-size-adjust: 100%;
  }

  body {
    padding: 0 !important;
    margin: 0;
    line-height: 1.85;
    width: 100% !important;
    max-width: 100% !important;
  }

  #header, #content, #footnotes, #footer {
    padding-left: 1.125rem !important;
    padding-right: 1.125rem !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }

  #content {
    margin-top: 0.5rem;
  }

  /* 書籍標題區域 — 壓縮高度 */
  #header {
    padding-top: 0.75rem !important;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--color-border-light);
    margin-bottom: 0.5rem;
  }

  #header > h1:first-child {
    font-size: 1.25rem;
    margin-top: 0.5rem;
    margin-bottom: 0.25rem;
    padding-bottom: 0.25rem;
    line-height: 1.35;
  }

  /* 作者/版本資訊壓縮 */
  #header .details {
    font-size: 0.75rem !important;
    padding: 0.25rem 0 !important;
    line-height: 1.3;
    opacity: 0.7;
  }

  /* 標題 */
  h1, h2, h3, h4, h5, h6 {
    overflow-wrap: break-word;
  }

  h1 { font-size: 1.5rem; margin-top: 1.5rem; margin-bottom: 0.6rem; }
  h2 { font-size: 1.3rem; margin-top: 1.75rem; margin-bottom: 0.5rem; border-bottom-width: 1px; }
  h3, #toctitle, .sidebarblock>.content>.title { font-size: 1.15rem; margin-top: 1.25rem; }
  h4, h5, h6 { font-size: 1.05rem; }

  #header .details {
    font-size: 0.85rem;
    padding: 0.5rem 0;
    flex-direction: column;
    gap: 0.25rem;
  }

  /* 段落 — 不用 justify，改用自然左對齊 */
  p {
    font-size: 1rem;
    line-height: 1.85;
    margin-bottom: 1.1rem;
    text-align: left;
    max-width: 100%;
  }

  /* 目錄 — 預設收合，只顯示章節層級 */
  #toc {
    padding: 0.75rem 0;
    margin-bottom: 1rem;
    max-width: 100%;
    overflow: hidden;
  }

  #toctitle {
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
  }

  #toc ul { margin-left: 0; padding-left: 0; max-width: 100%; }
  #toc > ul { margin-left: 0; }
  #toc ul ul { margin-left: 0.875rem; padding-left: 0; }

  #toc li {
    line-height: 1.5;
    margin-top: 0.4rem;
    max-width: 100%;
  }

  #toc a {
    display: block;
    padding: 0.4rem 0;
    font-size: 0.9rem;
    overflow-wrap: break-word;
  }

  #content #toc {
    padding: 0.875rem;
    margin-bottom: 1rem;
    box-sizing: border-box;
  }

  /* 程式碼區塊 — 最小 13px 確保可讀 */
  .literalblock, .listingblock {
    max-width: 100%;
    overflow: hidden;
    position: relative;
  }

  .literalblock pre,
  .listingblock > .content > pre {
    font-size: 0.825rem;
    line-height: 1.55;
    padding: 1rem;
    padding-top: 2.2rem;
    border-radius: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    box-sizing: border-box;
  }

  pre {
    white-space: pre;
    word-wrap: normal;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    position: relative;
  }

  pre code {
    font-size: 0.825rem;
    line-height: 1.55;
    word-break: normal;
    overflow-wrap: normal;
  }

  /* 行內程式碼 */
  :not(pre):not([class^=L]) > code {
    font-size: 0.85em;
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }

  /* 圖片 */
  .imageblock {
    margin: 1.25rem 0;
    max-width: 100%;
    overflow: hidden;
  }

  .imageblock img {
    max-width: 100% !important;
    width: auto !important;
    height: auto !important;
    display: block;
  }

  .imageblock > .title {
    font-size: 0.85rem;
    margin-top: 0.5rem;
    line-height: 1.4;
  }

  /* 表格 */
  table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 0.875rem;
  }

  table.tableblock { display: block; }
  table thead, table tbody, table tfoot { display: table; width: 100%; }
  table thead th, table tbody td { padding: 0.5rem 0.625rem; }

  /* 警告框 */
  .admonitionblock {
    max-width: 100%;
    overflow: hidden;
    margin: 1.25rem 0;
  }

  .admonitionblock > table {
    display: table;
    width: 100%;
    table-layout: fixed;
  }

  .admonitionblock > table td.icon {
    width: 40px;
    padding: 0.75rem 0.5rem;
    vertical-align: top;
    text-align: center;
  }

  .admonitionblock > table td.icon [class^="fa icon-"] {
    font-size: 1.4rem;
  }

  .admonitionblock > table td.content {
    padding: 0.75rem 0.875rem 0.75rem 0;
    font-size: 0.9rem;
    line-height: 1.7;
  }

  .admonitionblock > table td.content > .title {
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  /* 側邊欄 */
  .sidebarblock {
    padding: 1rem;
    margin: 1.25rem 0;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }

  .sidebarblock > .content > .title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--color-border-light);
  }

  .sidebarblock p { font-size: 0.9rem; line-height: 1.7; }

  /* 範例區塊 */
  .exampleblock {
    max-width: 100%;
    overflow: hidden;
    margin: 1.25rem 0;
  }

  .exampleblock > .content {
    padding: 1rem;
    max-width: 100%;
    box-sizing: border-box;
  }

  .exampleblock > .title {
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    margin: 0;
  }

  /* 引用區塊 */
  .quoteblock {
    margin: 1.5rem 0;
    padding: 0.75rem 0 0.75rem 1rem;
  }

  .quoteblock blockquote { margin: 0; padding: 0; }

  .quoteblock blockquote,
  .quoteblock p {
    font-size: 0.95rem;
    line-height: 1.75;
    font-style: italic;
  }

  .quoteblock blockquote::before { display: none; }

  .quoteblock .attribution {
    font-size: 0.85rem;
    margin-top: 0.5rem;
    font-style: normal;
  }

  .quoteblock .attribution::before { content: '\2014 '; }

  /* 列表 */
  ul, ol { margin-left: 1.125rem; padding-left: 0; max-width: 100%; }
  li { margin-bottom: 0.375rem; line-height: 1.7; max-width: 100%; }
  li p { margin-bottom: 0.5rem; }
  ul ul, ul ol, ol ul, ol ol { margin-left: 1rem; margin-top: 0.375rem; }

  /* 定義列表 */
  dl { max-width: 100%; }
  dl dt { margin-top: 0.875rem; font-size: 1rem; }
  dl dd { margin-left: 0.625rem; margin-bottom: 0.625rem; line-height: 1.7; max-width: 100%; }
  .hdlist > table { display: block; overflow-x: auto; }

  /* 章節 */
  .sect1, .sect2, .sect3 { max-width: 100%; overflow: hidden; }
  .sect1 { padding-bottom: 1.25rem; }
  .sect1 + .sect1 { padding-top: 1.25rem; }

  /* 頁腳 */
  #footer { padding: 1rem; font-size: 0.85rem; max-width: 100% !important; box-sizing: border-box; }
  #footer-text { line-height: 1.5; }

  /* 隱藏錨點連結 */
  h1 > a.anchor, h2 > a.anchor, h3 > a.anchor,
  h4 > a.anchor, h5 > a.anchor, h6 > a.anchor { display: none; }

  /* 註腳 */
  #footnotes { font-size: 0.85rem; padding: 0.75rem 0; max-width: 100% !important; }
  #footnotes .footnote { font-size: 0.8rem; margin-left: 0.875rem; line-height: 1.5; }

  /* 摺疊區塊 */
  details { margin-left: 0.5rem; max-width: 100%; }
  details > summary { padding: 0.5rem 0; font-size: 1rem; cursor: pointer; }

  /* toc2 模式 — 手機版隱藏固定側邊欄，改用浮動 TOC */
  body.toc2 { padding-left: 0 !important; padding-right: 0 !important; width: 100% !important; }

  #toc.toc2 {
    display: none !important;
  }

  /* Colist */
  .colist { max-width: 100%; overflow: hidden; }
  .colist > table { display: block; overflow-x: auto; }
}

/* ===== 極小螢幕 (小於 480px) ===== */
@media screen and (max-width: 479px) {
  #header, #content, #footnotes, #footer {
    padding-left: 0.875rem !important;
    padding-right: 0.875rem !important;
  }

  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.25rem; }
  h3, #toctitle, .sidebarblock>.content>.title { font-size: 1.1rem; }
  #header > h1:first-child { font-size: 1.25rem; }

  p { font-size: 0.95rem; line-height: 1.8; }

  .literalblock pre,
  .listingblock > .content > pre { font-size: 0.8rem; padding: 0.75rem; padding-top: 2rem; }

  pre code { font-size: 0.8rem; }

  table thead th, table tbody td { padding: 0.375rem 0.5rem; font-size: 0.8rem; }
  #toc a { font-size: 0.85rem; }
}

/* ===== 平板優化 (768px - 1024px) ===== */
@media screen and (min-width: 768px) and (max-width: 1024px) {
  #header, #content, #footnotes, #footer {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  body.toc2 { padding-left: 16em !important; }
  #toc.toc2 { width: 16em !important; font-size: 0.85rem; }
  #toc.toc2 ul ul { padding-left: 0.875em; }
}

/* ===== 觸控裝置優化 ===== */
@media (hover: none) and (pointer: coarse) {
  #toc a {
    padding: 0.5rem 0;
    min-height: 44px;
    display: flex;
    align-items: center;
  }

  p a, li a, td a, .paragraph a {
    min-height: auto;
    display: inline;
  }

  .listingblock:hover code[data-lang]::before {
    display: none;
  }

  h1:hover > a.anchor,
  h2:hover > a.anchor,
  h3:hover > a.anchor,
  h4:hover > a.anchor,
  h5:hover > a.anchor,
  h6:hover > a.anchor {
    visibility: hidden;
  }

  /* 觸控回饋 */
  button, a, [role="button"] {
    -webkit-tap-highlight-color: rgba(247, 147, 26, 0.2);
  }

  /* 浮動按鈕觸控效果 */
  #toc-toggle:active,
  #back-to-top-btn:active,
  #chapter-nav button:active {
    transform: scale(0.92);
  }

  /* 目錄項目觸控效果 */
  #floating-toc-content a:active {
    background: #fff0e0 !important;
  }

  /* 程式碼複製按鈕觸控效果 */
  .code-copy-btn:active {
    transform: scale(0.95);
  }
}

/* ===== 按鈕觸控優化 ===== */
#toc-toggle,
#back-to-top-btn,
#chapter-nav button {
  transition: transform 0.1s, opacity 0.2s, visibility 0.2s, background 0.15s;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== 閱讀進度條 ===== */
#reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3px;
  background: linear-gradient(90deg, #f7931a, #ff6b00);

}

/* ===== 章節導航按鈕 ===== */
#chapter-nav {
  position: fixed;
  bottom: 80px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9998;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}

#chapter-nav.visible {
  opacity: 1;
  visibility: visible;
}

#chapter-nav button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: #fff;

  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  display: flex;

  justify-content: center;
}

#chapter-nav button:active {
  background: rgba(0,0,0,0.85);
}

/* ===== 目錄按鈕 ===== */
#toc-toggle {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: #fff;
  border: none;
  font-size: 16px;
  cursor: pointer;
  z-index: 9998;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== 浮動目錄面板 ===== */
#floating-toc {
  position: fixed;
  bottom: 74px;
  left: 20px;
  width: calc(100vw - 40px);
  max-width: 320px;
  max-height: 65vh;
  background: var(--color-bg);
  border-radius: 12px;
  box-shadow: 0 4px 20px var(--color-shadow);
  z-index: 9999;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

#floating-toc.open {
  display: flex;
}

#floating-toc-header {
  padding: 12px 16px;
  background: var(--color-bg-secondary);
  border-bottom: 1px solid var(--color-border);
  font-weight: 600;
  font-size: 14px;
  color: var(--color-heading);
  font-family: var(--font-heading);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

#floating-toc-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  color: var(--color-text-muted);
}

/* 目錄搜尋框 */
#toc-search-wrap {
  padding: 8px 12px;
  border-bottom: 1px solid var(--color-border-light);
  flex-shrink: 0;
}

#toc-search {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
  background: var(--color-bg);
  color: var(--color-text);
}

#toc-search:focus {
  border-color: var(--color-accent);
}

#toc-search::placeholder {
  color: var(--color-text-muted);
}

/* 閱讀進度摘要 */
#toc-progress-summary {
  padding: 8px 16px;
  background: var(--color-bg-secondary);
  border-bottom: 1px solid var(--color-border-light);
  font-size: 12px;
  color: var(--color-text-muted);
  display: flex;
  justify-content: space-between;
  flex-shrink: 0;
}

#toc-progress-summary .progress-bar {
  height: 4px;
  background: var(--color-border);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

#toc-progress-summary .progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f7931a, #ff6b00);
  border-radius: 2px;
  transition: width 0.3s;
}

#floating-toc-content {
  padding: 8px 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;

}

#floating-toc-content a {

  align-items: center;
  padding: 10px 16px;
  color: var(--color-text);
  text-decoration: none;
  font-size: 14px;
  font-family: var(--font-ui);
  border-left: 3px solid transparent;
  transition: background 0.15s;
}

#floating-toc-content a:active,
#floating-toc-content a.current {
  background: var(--color-toc-active);
  border-left-color: var(--color-accent);
}

#floating-toc-content a.read {
  color: var(--color-text-muted);
}

#floating-toc-content a.read::after {
  content: '\2713';
  margin-left: auto;
  color: #4caf50;
  font-size: 12px;
}

#floating-toc-content .toc-h2 {
  padding-left: 16px;
}

#floating-toc-content .toc-h3 {
  padding-left: 28px;

  color: var(--color-text-secondary);
}

#floating-toc-content a.hidden {

}

/* ===== 當前章節指示器 ===== */
#current-chapter {
  position: fixed;
  top: 3px;
  left: 0;
  right: 0;
  background: var(--color-bg);
  padding: 8px 16px;
  font-size: 12px;
  color: var(--color-text-muted);
  font-family: var(--font-ui);
  text-align: center;
  z-index: 10000;
  transform: translateY(-100%);
  transition: transform 0.2s;
  box-shadow: 0 1px 3px var(--color-shadow);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

#current-chapter.visible {
  transform: translateY(0);
}

#current-chapter .chapter-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100% - 80px);
}

#current-chapter .reading-time {

  color: var(--color-text-muted);
  background: var(--color-bg-secondary);
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ===== 閱讀時間統計 ===== */
#reading-stats {
  position: fixed;
  bottom: 74px;
  right: 74px;
  background: var(--color-bg);
  padding: 8px 12px;
  border-radius: 8px;
  box-shadow: 0 2px 8px var(--color-shadow);
  font-size: 11px;
  color: var(--color-text-muted);
  font-family: var(--font-ui);
  z-index: 9997;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}

#reading-stats.visible {
  opacity: 1;
  visibility: visible;
}

#reading-stats .stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

#reading-stats .stat-row + .stat-row {

}

#reading-stats .stat-label {
  color: var(--color-text-muted);
}

#reading-stats .stat-value {
  font-weight: 500;
  color: var(--color-text);
}

/* ===== 閱讀優化 ===== */
p, li, td, th, blockquote, dd {
  word-break: normal;
  overflow-wrap: break-word;
}

pre, pre code {
  word-break: normal;
  overflow-wrap: normal;
  hyphens: none;
}

/* ===== 程式碼複製按鈕（全域） ===== */
.code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-family: var(--font-ui);
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  cursor: pointer;
  color: var(--color-text-secondary);

}

.code-copy-btn:hover {
  background: var(--color-bg);
  border-color: var(--color-accent);
  color: var(--color-accent);
}

.code-copy-btn:active {

}

.code-copy-btn.copied {
  background: #4caf50;
  color: #fff;
  border-color: #4caf50;
}

/* 程式碼區塊滾動提示 */
.code-scroll-hint {
  position: absolute;
  right: 8px;

}

/* ===== 暗色模式切換按鈕 ===== */
#theme-toggle {

  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--color-bg-secondary);

  justify-content: center;

}

#theme-toggle:hover {

  transform: scale(1.08);
}

#theme-toggle:active {
  transform: scale(0.95);
}

/* 字體大小控制 */

  top: 12px;
  right: 60px;

  gap: 4px;
  z-index: 10002;

  font-family: var(--font-ui);
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}

#font-controls button:hover {
  background: var(--color-toc-active);
}

/* 手動暗色模式 class */
html[data-theme="dark"] {
  --color-bg: #1a1b26;
  --color-bg-secondary: #1f2133;
  --color-bg-code: #24253a;
  --color-bg-sidebar: #1f2133;
  --color-bg-admonition: #1f2133;
  --color-bg-quote: #22233a;
  --color-text: #c9d1d9;
  --color-text-secondary: #9ca3af;
  --color-text-muted: #6b7280;
  --color-heading: #e6e8f0;
  --color-link: #6ea8fe;
  --color-link-hover: #93c5fd;
  --color-border: #30363d;
  --color-border-light: #2a2d3a;
  --color-accent: #f7931a;
  --color-accent-dark: #ff9f33;
  --color-code-text: #c9d1d9;
  --color-toc-bg: #1f2133;
  --color-toc-active: #2a2d3a;
  --color-shadow: rgba(0,0,0,0.3);
  --color-overlay: rgba(0,0,0,0.85);
}

/* ===== 暗色模式追加覆寫 ===== */
@media (prefers-color-scheme: dark) {
  /* Asciidoctor 內建樣式覆寫 */
  .literalblock pre,

<!-- 長篇書籍閱讀增強 -->
<script>
(function() {
  'use strict';

  // 章節資料
  var chapters = [];
  var currentChapterIndex = -1;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  function init() {
    // 無障礙：Skip Navigation
    var skipNav = document.createElement('a');
    skipNav.className = 'skip-nav';
    skipNav.href = '#content';
    skipNav.textContent = '跳至主要內容';
    document.body.insertBefore(skipNav, document.body.firstChild);

    // 收集章節資訊
    collectChapters();

    // 主題與控制
    addThemeToggle();
    addFontControls();

    // 頁內搜尋
    addPageSearch();

    // 基本功能
    addReadingProgress();
    addBackToTopButton();
    enhanceCodeBlocks();

    // 圖片 lazy loading
    addLazyLoading();

    // 桌面版 TOC 當前章節高亮
    if (window.innerWidth > 767) {
      addDesktopTocHighlight();
    }

    // 全域：閱讀進度持久化
    saveReadingPosition();

    // 手機版專屬功能
    if (window.innerWidth <= 767) {
      addFloatingToc();
      addChapterNav();
      addCurrentChapterIndicator();
      addImageZoom();
      addSwipeGesture();
    }
  }

  // 收集所有章節標題
  function collectChapters() {
    var headings = document.querySelectorAll('h1[id], h2[id]');
    headings.forEach(function(h, index) {
      chapters.push({
        id: h.id,
        text: h.textContent.replace(/^[\d\.\s]+/, '').trim(),
        level: h.tagName.toLowerCase(),
        element: h,
        index: index
      });
    });
  }

  // 暗色模式切換
  function addThemeToggle() {
    // 讀取使用者偏好
    var stored = null;
    try { stored = localStorage.getItem('mastering-bitcoin-theme'); } catch(e) {}

    if (stored === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else if (stored === 'light') {
      document.documentElement.removeAttribute('data-theme');
    }
    // 如果沒有 stored，使用系統偏好（CSS @media 已處理）

    var btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.setAttribute('aria-label', '切換深色/淺色模式');

    function updateIcon() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
        (!document.documentElement.hasAttribute('data-theme') &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      btn.textContent = isDark ? '\u2600' : '\u263D'; // ☀ or ☽
    }

    updateIcon();

    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (current === 'dark' || (!current && systemDark)) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('mastering-bitcoin-theme', 'light'); } catch(e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('mastering-bitcoin-theme', 'dark'); } catch(e) {}
      }
      updateIcon();
    });

    document.body.appendChild(btn);

    // 監聽系統主題變更
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (!localStorage.getItem('mastering-bitcoin-theme')) {
        updateIcon();
      }
    });
  }

  // 字體大小控制
  function addFontControls() {
    var stored = null;
    try { stored = localStorage.getItem('mastering-bitcoin-fontsize'); } catch(e) {}

    var currentSize = stored ? parseInt(stored) : 100;
    var minSize = 85;
    var maxSize = 130;

    if (stored) {
      document.documentElement.style.fontSize = currentSize + '%';
    }

    var wrap = document.createElement('div');
    wrap.id = 'font-controls';

    var smaller = document.createElement('button');
    smaller.textContent = 'A-';
    smaller.setAttribute('aria-label', '縮小字體');

    var bigger = document.createElement('button');
    bigger.textContent = 'A+';
    bigger.setAttribute('aria-label', '放大字體');

    smaller.addEventListener('click', function() {
      if (currentSize > minSize) {
        currentSize -= 5;
        document.documentElement.style.fontSize = currentSize + '%';
        try { localStorage.setItem('mastering-bitcoin-fontsize', currentSize); } catch(e) {}
      }
    });

    bigger.addEventListener('click', function() {
      if (currentSize < maxSize) {
        currentSize += 5;
        document.documentElement.style.fontSize = currentSize + '%';
        try { localStorage.setItem('mastering-bitcoin-fontsize', currentSize); } catch(e) {}
      }
    });

    wrap.appendChild(smaller);
    wrap.appendChild(bigger);
    document.body.appendChild(wrap);
  }

  // 頁內搜尋
  function addPageSearch() {
    var panel = document.createElement('div');
    panel.id = 'page-search';
    panel.innerHTML = '<input type="text" placeholder="搜尋內容..." id="page-search-input" autocomplete="off">' +
      '<span class="search-info" id="search-info"></span>' +
      '<button id="search-prev">\u25B2</button>' +
      '<button id="search-next">\u25BC</button>' +
      '<button id="search-close">\u2715</button>';
    document.body.appendChild(panel);

    var input = document.getElementById('page-search-input');
    var info = document.getElementById('search-info');
    var highlights = [];
    var currentIdx = -1;
    var searchTimeout;

    function clearHighlights() {
      highlights.forEach(function(el) {
        var parent = el.parentNode;
        parent.replaceChild(document.createTextNode(el.textContent), el);
        parent.normalize();
      });
      highlights = [];
      currentIdx = -1;
      info.textContent = '';
    }

    function doSearch(query) {
      clearHighlights();
      if (!query || query.length < 2) return;

      var content = document.getElementById('content');
      if (!content) return;

      var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
      var textNodes = [];
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue.trim()) {
          textNodes.push(walker.currentNode);
        }
      }

      var lowerQuery = query.toLowerCase();
      textNodes.forEach(function(node) {
        var text = node.nodeValue;
        var lowerText = text.toLowerCase();
        var idx = lowerText.indexOf(lowerQuery);
        if (idx === -1) return;
        // 不處理 pre/code 內的文字
        if (node.parentElement.closest('pre, code, script, style')) return;

        var before = text.substring(0, idx);
        var match = text.substring(idx, idx + query.length);
        var after = text.substring(idx + query.length);

        var mark = document.createElement('mark');
        mark.className = 'search-highlight';
        mark.textContent = match;

        var parent = node.parentNode;
        var frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        frag.appendChild(mark);
        if (after) frag.appendChild(document.createTextNode(after));
        parent.replaceChild(frag, node);
        highlights.push(mark);
      });

      if (highlights.length > 0) {
        currentIdx = 0;
        jumpTo(0);
      }
      info.textContent = highlights.length > 0 ? (currentIdx + 1) + '/' + highlights.length : '無結果';
    }

    function jumpTo(idx) {
      if (highlights.length === 0) return;
      highlights.forEach(function(h) { h.classList.remove('current'); });
      currentIdx = ((idx % highlights.length) + highlights.length) % highlights.length;
      highlights[currentIdx].classList.add('current');
      highlights[currentIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      info.textContent = (currentIdx + 1) + '/' + highlights.length;
    }

    input.addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() { doSearch(input.value.trim()); }, 300);
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpTo(e.shiftKey ? currentIdx - 1 : currentIdx + 1);
      } else if (e.key === 'Escape') {
        closeSearch();
      }
    });

    document.getElementById('search-prev').addEventListener('click', function() { jumpTo(currentIdx - 1); });
    document.getElementById('search-next').addEventListener('click', function() { jumpTo(currentIdx + 1); });
    document.getElementById('search-close').addEventListener('click', closeSearch);

    function openSearch() {
      panel.classList.add('open');
      input.focus();
      input.select();
    }

    function closeSearch() {
      panel.classList.remove('open');
      clearHighlights();
      input.value = '';
    }

    // Ctrl+Shift+F / Cmd+Shift+F 開啟搜尋
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
        e.preventDefault();
        if (panel.classList.contains('open')) {
          closeSearch();
        } else {
          openSearch();
        }
      }
    });
  }

  // 圖片 Lazy Loading
  function addLazyLoading() {
    var images = document.querySelectorAll('.imageblock img');
    images.forEach(function(img) {
      // 首屏圖片不 lazy load
      if (img.getBoundingClientRect().top > window.innerHeight * 1.5) {
        img.setAttribute('loading', 'lazy');
        img.setAttribute('decoding', 'async');
      }
    });
  }

  // 桌面版 TOC 可收合 + 當前章節高亮
  function addDesktopTocHighlight() {
    var toc = document.getElementById('toc');
    if (!toc) return;

    // 可收合功能：為有子列表的 li 加入 toggle
    var parentItems = toc.querySelectorAll('li');
    parentItems.forEach(function(li) {
      var subList = li.querySelector('ul');
      if (subList) {
        var toggle = document.createElement('span');
        toggle.className = 'toc-toggle';
        toggle.textContent = '\u25BC'; // ▼
        toggle.setAttribute('aria-label', '展開/收合');
        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          li.classList.toggle('toc-collapsed');
          toggle.classList.toggle('collapsed');
        });
        li.insertBefore(toggle, li.firstChild);
        // 預設收合子章節（只展開 sectlevel0）
        if (li.parentElement && li.parentElement.classList.contains('sectlevel1')) {
          li.classList.add('toc-collapsed');
          toggle.classList.add('collapsed');
        }
      }
    });

    var tocLinks = toc.querySelectorAll('a');
    var sections = [];
    tocLinks.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href && href.startsWith('#')) {
        var target = document.getElementById(href.substring(1));
        if (target) {
          sections.push({ link: link, target: target });
        }
      }
    });

    if (sections.length === 0) return;

    var ticking = false;
    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          var scrollY = window.scrollY + 120;
          var current = null;

          for (var i = sections.length - 1; i >= 0; i--) {
            if (sections[i].target.offsetTop <= scrollY) {
              current = sections[i];
              break;
            }
          }

          tocLinks.forEach(function(link) { link.classList.remove('toc-active'); });
          if (current) {
            current.link.classList.add('toc-active');

            // 自動展開當前章節所在的 TOC 分支
            var parentLi = current.link.closest('li');
            while (parentLi) {
              if (parentLi.classList.contains('toc-collapsed')) {
                parentLi.classList.remove('toc-collapsed');
                var tog = parentLi.querySelector('.toc-toggle');
                if (tog) tog.classList.remove('collapsed');
              }
              parentLi = parentLi.parentElement ? parentLi.parentElement.closest('li') : null;
            }

            // 滾動 TOC 使當前項可見
            var tocEl = document.getElementById('toc');
            if (tocEl && current.link.offsetParent) {
              var linkRect = current.link.getBoundingClientRect();
              var tocRect = tocEl.getBoundingClientRect();
              if (linkRect.top < tocRect.top || linkRect.bottom > tocRect.bottom) {
                current.link.scrollIntoView({ block: 'center', behavior: 'smooth' });
              }
            }
          }
          ticking = false;
        });
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // 初始化

    // 桌面版 TOC 閱讀統計面板
    addTocStats(toc);
  }

  function addTocStats(toc) {
    var statsDiv = document.createElement('div');
    statsDiv.id = 'toc-stats';

    var h2Chapters = chapters.filter(function(ch) { return ch.level === 'h2'; });
    var totalChapters = h2Chapters.length;

    statsDiv.innerHTML = '<div id="toc-stats-text"></div>' +
      '<div class="stats-progress"><div class="stats-fill" id="toc-stats-fill"></div></div>';
    toc.appendChild(statsDiv);

    // 計算全書字數
    var content = document.getElementById('content');
    var fullText = content ? content.textContent : '';
    var totalChinese = (fullText.match(/[\u4e00-\u9fff]/g) || []).length;
    var totalEnglish = (fullText.match(/[a-zA-Z]+/g) || []).length;
    var totalWords = totalChinese + totalEnglish;
    var totalMinutes = Math.ceil(totalWords / 400);
    var totalHours = Math.floor(totalMinutes / 60);
    var remainMins = totalMinutes % 60;
    var timeStr = totalHours > 0 ? totalHours + ' 小時 ' + remainMins + ' 分' : totalMinutes + ' 分鐘';

    function updateStats() {
      var readCount = 0;
      try {
        var saved = localStorage.getItem('mastering-bitcoin-read-chapters');
        if (saved) {
          var rc = JSON.parse(saved);
          h2Chapters.forEach(function(ch) { if (rc[ch.id]) readCount++; });
        }
      } catch(e) {}

      var pct = totalChapters > 0 ? Math.round((readCount / totalChapters) * 100) : 0;
      var textEl = document.getElementById('toc-stats-text');
      var fillEl = document.getElementById('toc-stats-fill');
      if (textEl) textEl.textContent = '已讀 ' + readCount + '/' + totalChapters + ' 章 (' + pct + '%) · 全書約 ' + timeStr;
      if (fillEl) fillEl.style.width = pct + '%';
    }

    updateStats();
    // 每 30 秒更新
    setInterval(updateStats, 30000);
  }

  function navigateChapter(direction) {

  // 計算閱讀時間（中文每分鐘約 400 字）
  var totalWordCount = 0;
  var chapterWordCounts = {};

  function calculateReadingTime() {
    var content = document.getElementById('content');
    if (!content) return;

    var text = content.textContent || '';
    // 計算中文字數和英文單字數
    var chineseChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    var englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
    totalWordCount = chineseChars + englishWords;

    // 計算各章節字數
    chapters.forEach(function(ch, idx) {
      var nextCh = chapters[idx + 1];
      var startEl = ch.element;
      var endEl = nextCh ? nextCh.element : null;

      var chText = '';
      var current = startEl;
      while (current && current !== endEl) {
        chText += current.textContent || '';
        current = current.nextElementSibling;
      }

      var chChinese = (chText.match(/[\u4e00-\u9fff]/g) || []).length;
      var chEnglish = (chText.match(/[a-zA-Z]+/g) || []).length;
      chapterWordCounts[ch.id] = chChinese + chEnglish;
    });
  }

  function getReadingTimeText(wordCount) {
    var minutes = Math.ceil(wordCount / 400);
    if (minutes < 1) return '<1 \u5206\u9418';
    if (minutes >= 60) {
      var hours = Math.floor(minutes / 60);
      var mins = minutes % 60;
      return hours + ' \u5c0f\u6642' + (mins > 0 ? ' ' + mins + ' \u5206' : '');
    }
    return minutes + ' \u5206\u9418';
  }

  // 當前章節指示器
  function addCurrentChapterIndicator() {
    calculateReadingTime();

    var indicator = document.createElement('div');
    indicator.id = 'current-chapter';
    indicator.innerHTML = '<span class="chapter-title"></span><span class="reading-time"></span>';
    document.body.appendChild(indicator);

    var lastScrollY = 0;

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          var scrollY = window.scrollY;

          // 更新當前章節
          updateCurrentChapter();

          // 顯示/隱藏指示器（向下滾動且已滾動超過 200px 時顯示）
          if (scrollY > 200 && scrollY > lastScrollY) {
            indicator.classList.add('visible');
          } else {
            indicator.classList.remove('visible');
          }

          lastScrollY = scrollY;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });
  }

  function updateCurrentChapter() {
    var scrollY = window.scrollY + 100;
    var newIndex = -1;

    for (var i = chapters.length - 1; i >= 0; i--) {
      if (chapters[i].element.offsetTop <= scrollY) {
        newIndex = i;
        break;
      }
    }

    if (newIndex !== currentChapterIndex) {
      currentChapterIndex = newIndex;
      var indicator = document.getElementById('current-chapter');
      if (indicator && currentChapterIndex >= 0) {
        var ch = chapters[currentChapterIndex];

        // 更新章節標題
        var titleEl = indicator.querySelector('.chapter-title');
        if (titleEl) {
          titleEl.textContent = ch.text.substring(0, 25) + (ch.text.length > 25 ? '...' : '');
        }

        // 更新閱讀時間
        var timeEl = indicator.querySelector('.reading-time');
        if (timeEl && chapterWordCounts[ch.id]) {
          timeEl.textContent = getReadingTimeText(chapterWordCounts[ch.id]);
        }

        // 標記章節為已讀（只標記 h2 章節）
        if (ch.level === 'h2' && !readChapters[ch.id]) {
          readChapters[ch.id] = Date.now();
          try {
            localStorage.setItem('mastering-bitcoin-read-chapters', JSON.stringify(readChapters));
          } catch(e) {}

          // 更新目錄中的已讀標記
          var tocLink = document.querySelector('#floating-toc-content a[href="#' + ch.id + '"]');
          if (tocLink) tocLink.classList.add('read');
        }
      }
      updateTocHighlight();
    }
  }

  // 儲存閱讀位置（全域，桌面+手機）
  function saveReadingPosition() {
    var storageKey = 'mastering-bitcoin-reading-position';

    // 恢復閱讀位置 — 用 toast 取代 confirm
    try {
      var saved = localStorage.getItem(storageKey);
      if (saved) {
        var data = JSON.parse(saved);
        var now = Date.now();
        if (now - data.timestamp < 7 * 24 * 60 * 60 * 1000 && data.scrollY > 300) {
          setTimeout(function() {
            showResumeToast(data);
          }, 800);
        }
      }
    } catch(e) {}

    // 定期儲存位置
    var saveTimeout;
    window.addEventListener('scroll', function() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(function() {
        try {
          var chapterText = currentChapterIndex >= 0 ? chapters[currentChapterIndex].text : '';
          localStorage.setItem(storageKey, JSON.stringify({
            scrollY: window.scrollY,
            chapter: chapterText,
            timestamp: Date.now()
          }));
        } catch(e) {}
      }, 1000);
    }, { passive: true });
  }

  // 中文字拼音首字母（Unicode 區間法，涵蓋常用字）
  function getPinyinInitials(str) {
    var initials = '';
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0x4e00 && c <= 0x9fff) {
        initials += getPinyinInitial(c);
      } else if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) {
        initials += str[i].toLowerCase();
      }
    }
    return initials;
  }

  function getPinyinInitial(code) {
    var map = [
      [0x5765,'a'],[0x5e7C,'b'],[0x5D14,'c'],[0x592A,'d'],[0x53F8,'e'],
      [0x7A47,'f'],[0x5C3B,'g'],[0x9EC4,'h'],[0x5360,'j'],[0x5F00,'k'],
      [0x62C9,'l'],[0x5988,'m'],[0x62FF,'n'],[0x5594,'o'],[0x5991,'p'],
      [0x671F,'q'],[0x7136,'r'],[0x4EE8,'s'],[0x4ED6,'t'],[0x7A75,'w'],
      [0x5915,'x'],[0x4E2B,'y'],[0x5E00,'z']
    ];
    // 簡化的 Unicode 區間對照
    var pinyinMap = 'ABCDEFGHJKLMNOPQRSTWXYZ';
    var bounds = [
      19968,19978,19993,20048,20102,20285,20588,20710,21040,21574,
      22303,22763,23130,23569,24063,24417,25165,25930,26413,27671,
      28516,29835,30495
    ];
    for (var i = bounds.length - 1; i >= 0; i--) {
      if (code >= bounds[i]) {
        return pinyinMap[i].toLowerCase();
      }
    }
    return '';
  }

  // 程式碼區塊增強
  function enhanceCodeBlocks() {
    var codeBlocks = document.querySelectorAll('.listingblock, .literalblock');
    codeBlocks.forEach(function(block) {
      var pre = block.querySelector('pre');
      if (!pre) return;

      var content = block.querySelector('.content') || block;

      // 行號：5行以上的程式碼區塊加入行號
      var codeText = pre.textContent || '';
      var lines = codeText.split('\n');
      if (lines.length >= 5 && block.classList.contains('listingblock')) {
        block.classList.add('has-line-numbers');
        var lineNums = document.createElement('div');
        lineNums.className = 'code-line-numbers';
        lineNums.setAttribute('aria-hidden', 'true');
        var nums = [];
        for (var ln = 1; ln <= lines.length; ln++) nums.push(ln);
        lineNums.textContent = nums.join('\n');
        content.style.position = 'relative';
        content.insertBefore(lineNums, pre);
      }

      // 檢查是否需要橫向滾動
      if (pre.scrollWidth > pre.clientWidth + 10) {
        block.classList.add('has-overflow');

        // 滾動提示
        var hint = document.createElement('span');
        hint.className = 'code-scroll-hint';
        hint.textContent = '\u2190 \u53ef\u6ed1\u52d5 \u2192';
        content.appendChild(hint);

        // 滾動後隱藏提示
        pre.addEventListener('scroll', function() {
          hint.style.opacity = '0';
        }, { once: true, passive: true });
      }

      // 複製按鈕
      var copyBtn = document.createElement('button');
      copyBtn.className = 'code-copy-btn';
      copyBtn.textContent = '\u8907\u88fd';
      copyBtn.setAttribute('aria-label', '\u8907\u88fd\u7a0b\u5f0f\u78bc');

      copyBtn.addEventListener('click', function(e) {
        e.preventDefault();
        var code = pre.textContent;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function() {
            showCopySuccess(copyBtn);
          }).catch(function() {
            fallbackCopy(code, copyBtn);
          });
        } else {
          fallbackCopy(code, copyBtn);
        }
      });

      content.style.position = 'relative';
      content.appendChild(copyBtn);

      // 無障礙屬性
      pre.setAttribute('tabindex', '0');
      pre.setAttribute('role', 'region');
      pre.setAttribute('aria-label', '\u7a0b\u5f0f\u78bc\u5340\u584a');
    });
  }

  function showCopySuccess(btn) {
    btn.textContent = '\u5df2\u8907\u88fd';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = '\u8907\u88fd';
      btn.classList.remove('copied');
    }, 1500);
  }

  function fallbackCopy(text, btn) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      showCopySuccess(btn);
    } catch(e) {
      btn.textContent = '\u5931\u6557';
    }
    document.body.removeChild(textarea);
  }

  // 滑動手勢支援（左右滑動切換章節）
  function addSwipeGesture() {
    var touchStartX = 0;
    var touchStartY = 0;
    var touchEndX = 0;
    var touchEndY = 0;
    var minSwipeDistance = 80;

    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      var deltaX = touchEndX - touchStartX;
      var deltaY = touchEndY - touchStartY;

      // 只處理水平滑動（且垂直移動不大）
      if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaY) < 100) {
        // 檢查是否在可滾動元素內
        var activeEl = document.activeElement;
        if (activeEl && (activeEl.scrollWidth > activeEl.clientWidth)) {
          return; // 在可橫向滾動的元素內，不處理手勢
        }

        if (deltaX > 0) {
          // 右滑 -> 上一章
          navigateChapter(-1);
          showSwipeHint('\u2190 \u4e0a\u4e00\u7ae0');
        } else {
          // 左滑 -> 下一章
          navigateChapter(1);
          showSwipeHint('\u4e0b\u4e00\u7ae0 \u2192');
        }
      }
    }
  }

  function showSwipeHint(text) {
    var hint = document.createElement('div');
    hint.textContent = text;
    hint.style.cssText = [
      'position: fixed',
      'top: 50%',
      'left: 50%',
      'transform: translate(-50%, -50%)',
      'background: rgba(0,0,0,0.7)',
      'color: #fff',
      'padding: 12px 24px',
      'border-radius: 8px',
      'font-size: 14px',
      'z-index: 10003',
      'pointer-events: none',
      'opacity: 1',
      'transition: opacity 0.3s'
    ].join(';');

    document.body.appendChild(hint);

    setTimeout(function() {
      hint.style.opacity = '0';
      setTimeout(function() {
        if (hint.parentNode) {
          document.body.removeChild(hint);
        }
      }, 300);
    }, 600);
  }

      'display: flex',
      'align-items: center',
      'justify-content: center',
      'padding: 1rem',
      'cursor: zoom-out'
    ].join(';');

    var imgClone = document.createElement('img');
    imgClone.src = img.src;
    imgClone.alt = img.alt || '';
    imgClone.style.cssText = 'max-width: 100%; max-height: 100%; object-fit: contain;';

    overlay.appendChild(imgClone);

    overlay.addEventListener('click', function() {
      document.body.removeChild(overlay);
    });

    document.addEventListener('keydown', function closeOnEsc(e) {
      if (e.key === 'Escape') {
        if (document.body.contains(overlay)) {
          document.body.removeChild(overlay);
        }
        document.removeEventListener('keydown', closeOnEsc);
      }
    });

    document.body.appendChild(overlay);
  }
  // Service Worker 註冊
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  }
})();
</script>
