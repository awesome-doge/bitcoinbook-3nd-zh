<!-- 單檔 HTML 下載版使用的精簡樣式；線上閱讀網站由 scripts/build-site.rb 產生，不使用此檔 -->
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root { --bg: #fbfaf7; --text: #24221e; --muted: #5c584f; --border: #e4e0d6; --soft: #f3f1eb; --link: #a8510a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --text: #dedbd4; --muted: #a7a297; --border: #303037; --soft: #1f1f25; --link: #f2a654; }
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 18px; line-height: 1.85; }
#header, #content, #footnotes, #footer { max-width: 44em; }
h1, h2, h3, h4, h5, h6, #toctitle, .sidebarblock > .content > .title { color: var(--text); font-family: inherit; font-weight: 700; line-height: 1.4; }
a, a:visited { color: var(--link); }
p, li, dd, td { font-family: inherit; color: var(--text); }
em { font-synthesis: none; }
#toc.toc2 { background: var(--soft); border-color: var(--border); }
#toc a { color: var(--muted); }
pre, .listingblock pre, .literalblock pre, .listingblock pre.highlight { background: var(--soft) !important; color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 0.8em; }
:not(pre) > code { background: var(--soft); color: inherit; }
.admonitionblock > table, .sidebarblock, .exampleblock > .content { background: var(--soft); border-color: var(--border); }
.admonitionblock td.icon .title { font-weight: 700; color: var(--link); }
table.tableblock, th.tableblock, td.tableblock { border-color: var(--border) !important; }
.imageblock img { background: #fff; border-radius: 4px; }
.imageblock > .title, .exampleblock > .title, caption.title { color: var(--muted); font-style: normal; }
</style>
