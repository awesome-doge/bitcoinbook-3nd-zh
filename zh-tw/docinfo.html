        "text": "SegWit（隔離見證）是2017年啟用的比特幣協議升級。它將交易簽名（見證數據）與交易數據分離，解決了交易延展性問題，並有效增加了區塊容量。SegWit 也為閃電網路等第二層解決方案奠定了基礎。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是 UTXO？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "UTXO（未花費交易輸出）是比特幣交易模型的核心概念。每筆比特幣交易消耗先前的 UTXO 並創建新的 UTXO。你的比特幣餘額實際上是所有歸屬於你地址的 UTXO 的總和。這種模型確保了比特幣不會被雙重花費。"
      }
    },
    {
      "@type": "Question",
      "name": "這本書適合誰閱讀？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "《精通比特幣》第三版適合軟體開發者、區塊鏈工程師、系統架構師，以及對比特幣技術原理有深入了解興趣的讀者。本書假設讀者具備基本的程式設計知識，但會從基礎概念開始逐步深入到進階主題。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是私鑰和公鑰？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "私鑰是一個256位元的隨機數，是控制比特幣的唯一憑證，必須保密。公鑰是從私鑰透過橢圓曲線密碼學（ECC）推導出來的，可以公開分享。比特幣地址則是從公鑰進一步推導而來。私鑰用於簽署交易，公鑰用於驗證簽名。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是 HD 錢包和助記詞？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "HD 錢包（Hierarchical Deterministic Wallet，分層確定性錢包）是一種可以從單一種子派生出無限數量密鑰對的錢包技術（BIP32/BIP44）。助記詞（BIP39）是由12或24個英文單詞組成的短語，用於備份和恢復錢包。只要保存好助記詞，就能恢復整個錢包的所有密鑰。"
      }
    },
    {
      "@type": "Question",
      "name": "比特幣的區塊獎勵是多少？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "比特幣的區塊獎勵每210,000個區塊（約4年）減半一次。最初為50 BTC，2012年減為25 BTC，2016年減為12.5 BTC，2020年減為6.25 BTC，2024年4月減為3.125 BTC。預計到2140年左右，所有2,100萬枚比特幣將全部發行完畢。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是比特幣地址格式？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "比特幣有多種地址格式：Legacy 地址（P2PKH）以1開頭；P2SH 地址以3開頭；Bech32 地址（SegWit，P2WPKH/P2WSH）以bc1q開頭；Bech32m 地址（Taproot，P2TR）以bc1p開頭。較新的地址格式通常手續費更低且功能更強大。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是 Schnorr 簽名？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Schnorr 簽名是 Taproot 升級引入的數位簽名方案（BIP340），取代了原有的 ECDSA 簽名。優點包括：簽名更小、驗證更快、支援簽名聚合（多個簽名可以合併為一個）、提高隱私性。Schnorr 簽名使多重簽名交易看起來與普通交易相同。"

      }
    },
    {
      "@type": "Question",
      "name": "比特幣和以太坊有什麼區別？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "比特幣是第一個區塊鏈，專注於成為去中心化的數位貨幣和價值儲存。以太坊則是一個智能合約平台，支援更複雜的可程式化應用（DApps）。比特幣使用 UTXO 模型，以太坊使用帳戶模型。比特幣追求安全性和去中心化，以太坊追求靈活性和功能性。"
      }
